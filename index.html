<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0F" />
<title>Fut com Cristo</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Fut com Cristo" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
:root{
  --blue:#2563EB; --blue-d:#1D4ED8; --ink:#0B0B0F; --bg:#F4F6FA; --red:#DC2626;
  --t1:#0F172A; --t2:#64748B; --line:#EEF1F6; --field:#F1F3F7;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid rgba(37,99,235,.5);outline-offset:2px}
ul,ol{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none;display:block}
.i16{width:16px;height:16px}.i24{width:24px;height:24px}.i28{width:28px;height:28px}.i32{width:32px;height:32px}

/* ---------- Estrutura ---------- */
.shell{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
.hero{position:relative;background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 62px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-mask-image:radial-gradient(120% 95% at 85% 0%,#000 15%,transparent 78%);mask-image:radial-gradient(120% 95% at 85% 0%,#000 15%,transparent 78%)}
.hero::after{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.6),transparent 66%)}
.hero>*{position:relative;z-index:1}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(37,99,235,.45)}
.hactions{display:flex;align-items:center;gap:8px}
.glass{min-height:44px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;transition:transform .15s,background .15s}
.glass:active{transform:scale(.96);background:rgba(255,255,255,.22)}
.glass.static{pointer-events:none}
.glass.sy{padding:0 13px;position:relative}
.sdot{width:9px;height:9px;border-radius:50%;background:#9CA3AF;display:inline-block;flex:none}
.sdot.ok{background:#22C55E}.sdot.busy{background:#FACC15;animation:pulse 1s infinite}.sdot.err{background:#EF4444}
@keyframes pulse{50%{opacity:.35}}
.syrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:10px 0 12px}
.hero h1{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.035em;margin-top:24px}
.hero .sub{color:rgba(255,255,255,.7);font-size:14px;margin-top:8px}
.sheet{position:relative;background:#fff;border-radius:28px 28px 0 0;margin-top:-30px;padding:22px 16px 0;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px)}
.content{display:flex;flex-direction:column;gap:16px;padding-bottom:210px}
.content.noact{padding-bottom:130px}
.content.fade>*{animation:rise .24s ease both}
.content.fade>*:nth-child(2){animation-delay:.04s}
.content.fade>*:nth-child(3){animation-delay:.08s}
.content.fade>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.enter{animation:rise .24s ease both}

/* ---------- Cards e tipografia ---------- */
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:20px}
.card.np{padding:0;overflow:hidden}
.ttl{font-size:17px;font-weight:800;letter-spacing:-.01em}
.lab{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.04em;text-transform:uppercase}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.big span{font-size:16px;font-weight:600;color:var(--t2);letter-spacing:0}
.muted{color:var(--t2);font-size:14px;line-height:1.45}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack>*+*{margin-top:14px}
.tile{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tile.blue{background:#DBEAFE;color:#1D4ED8}
.tile.gray{background:#EEF1F6;color:#475569}
.tile.amber{background:#FEF3C7;color:#92400E}
.tile.red{background:#FEE2E2;color:#B91C1C}
.tile.ink{background:var(--ink);color:#fff}
.tile.lg{width:68px;height:68px;border-radius:22px}

/* ---------- Botões, chips, inputs ---------- */
.btn{height:52px;padding:0 24px;border-radius:999px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s,opacity .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.btn.sm{height:44px;padding:0 18px;font-size:14px}
.pri{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.32)}
.inkb{background:var(--ink);color:#fff;box-shadow:0 10px 22px rgba(11,11,15,.28)}
.sec{background:#EEF1F6;color:#1E293B}
.dng{background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(220,38,38,.28)}
.btn .cnt{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;font-size:13px}
.inp{width:100%;height:52px;border:0;border-radius:14px;background:var(--field);padding:0 16px;font-size:16px;outline:none;transition:box-shadow .15s,background .15s}
.inp::placeholder{color:#6B7A90}
.inp:focus{background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;background:var(--field);color:#475569;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:#DBEAFE;color:#1D4ED8}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c0{background:#DBEAFE;color:#1D4ED8}
.c1{background:#EEF1F6;color:#475569}
.c2{background:#FEF3C7;color:#92400E}
.c3{background:#DCFCE7;color:#166534}
.qhead{list-style:none;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);padding:14px 0 2px}
.qhead.inc{color:#B45309}
.chip:disabled{opacity:.5}
.ruleb{background:#EEF3FF;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.4;color:#1E3A8A;margin-bottom:12px;font-weight:600}
.ruleb.warn{background:#FFF6DC;color:#92400E}
button.pill{position:relative;transition:transform .15s}
button.pill::before{content:"";position:absolute;inset:-10px -6px}
button.pill:active{transform:scale(.94)}
.link{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;font-size:14px;font-weight:700;color:var(--blue-d)}
.link svg{transition:transform .2s}
.link.open svg{transform:rotate(180deg)}
.rules{display:flex;flex-direction:column;gap:6px;padding:2px 0 4px;animation:rise .2s ease both}

/* ---------- Estatísticas ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{border-radius:18px;padding:12px 10px 10px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:11.5px;font-weight:700;white-space:nowrap}
.stat.s0{background:#EFF4FF;color:#1D4ED8}
.stat.s1{background:#F1F3F7;color:#475569}
.stat.s2{background:#FFF6DC;color:#92400E}
.track{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}

/* ---------- Linhas ---------- */
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.av.sm{width:38px;height:38px;font-size:13px}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.gtag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--blue-d)}
.rowwrap{display:flex;align-items:center;gap:4px}
.prow{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:68px;padding:8px 12px;border-radius:20px;text-align:left;transition:background .15s,transform .12s}
.prow:active{transform:scale(.985)}
.prow.on{background:#EFF4FF}
.check{width:30px;height:30px;border-radius:50%;border:2px solid #C5CCD8;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:background .15s,border-color .15s}
.check svg{opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.on .check{background:var(--blue);border-color:var(--blue)}
.on .check svg{opacity:1;transform:none}
.icb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#94A3B8;background:var(--field);flex:none;transition:background .15s,color .15s,transform .15s}
.icb:active{transform:scale(.92)}
.icb.on{background:var(--blue);color:#fff}
.icb.del{background:#FEF2F2;color:var(--red)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.sep{height:1px;background:var(--line);margin:4px 0}

/* ---------- Times ---------- */
.team{border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.strip{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff}
.team.A .strip{background:var(--blue)}
.team.B .strip{background:var(--red)}
.strip h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.strip .cn{background:rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.tbody{padding:16px 16px 10px}
.gkb{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;margin-top:8px}
.team.A .gkb{background:#EFF4FF}
.team.B .gkb{background:#FEF2F2}
.why{font-size:12px;color:var(--t2);margin-top:4px;line-height:1.35}
.lg2{font-size:12px;font-weight:700;color:var(--red)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.swap{height:44px;padding:0 14px;border-radius:999px;background:var(--field);color:#1E293B;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none;transition:transform .15s,background .15s}
.swap:active{transform:scale(.95);background:#E3E7EE}
.qrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qn{width:34px;height:34px;border-radius:50%;background:var(--field);color:#475569;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.qrow.first .qn{background:var(--blue);color:#fff}

/* ---------- Partida ---------- */
.ringwrap{position:relative;width:250px;height:250px;margin:4px auto 0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.rtrack{fill:none;stroke:var(--line);stroke-width:14}
.rprog{fill:none;stroke:var(--blue);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.rprog.low{stroke:var(--red)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.clock{font-size:54px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.clock.low{color:var(--red)}
.status{font-size:13px;font-weight:600;color:var(--t2);margin-top:6px}
.row2{display:flex;gap:10px;margin-top:20px}
.row2>*{flex:1}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.sc .strip{justify-content:center;padding:12px}
.sc .strip h3{font-size:16px}
.sc.A .strip{background:var(--blue)}
.sc.B .strip{background:var(--red)}
.scb{padding:14px 14px 8px;text-align:center}
.num{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.sc.A .num{color:var(--blue-d)}
.sc.B .num{color:var(--red)}
.golb{height:56px;font-size:18px;margin-top:10px}
.undo{min-height:44px;padding:0 12px;font-size:13px;font-weight:600;color:var(--t2)}
.undo:disabled{opacity:.35}

/* ---------- Dock (ação + navegação) ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;padding:28px 16px calc(12px + env(safe-area-inset-bottom));z-index:30;pointer-events:none;background:linear-gradient(to top,#fff 58%,rgba(255,255,255,0))}
.dock>*{pointer-events:auto}
.nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:999px;padding:6px;margin-top:12px;box-shadow:0 14px 34px rgba(15,23,42,.18),0 2px 6px rgba(15,23,42,.06)}
.nav button{height:52px;min-width:52px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#64748B;font-size:14px;font-weight:700;transition:background .18s,color .18s,transform .15s}
.nav button:active{transform:scale(.94)}
.nav button span{display:none}
.nav button.on{background:var(--blue);color:#fff;padding:0 20px;box-shadow:0 8px 18px rgba(37,99,235,.35)}
.nav button.on span{display:inline}
.nav svg{width:22px;height:22px}

/* ---------- Toasts, vazio, bottom sheet ---------- */
.toasts{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;padding:calc(12px + env(safe-area-inset-top)) 14px 0;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 6px 12px 14px;box-shadow:0 16px 36px rgba(0,0,0,.34);font-size:14px;line-height:1.4}
.toast.enter{animation:drop .24s ease both}
.toast .ti{margin-top:2px;flex:none}
.toast.warn .ti{color:#FBBF24}
.toast.error .ti{color:#F87171}
.toast .msg{flex:1;padding-top:1px}
.toast button{width:44px;height:30px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);margin-top:-6px;flex:none}
.moment{background:linear-gradient(135deg,#EFF4FF,#fff 70%)}
.vs{font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.01em;margin-top:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:22px 12px}
.empty p{color:var(--t2);font-size:15px;max-width:260px;line-height:1.4}
.scrim{position:fixed;inset:0;background:rgba(11,11,15,.55);z-index:70;animation:fadein .2s ease both}
.bsheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));z-index:80;box-shadow:0 -16px 50px rgba(0,0,0,.28);max-height:90vh;overflow-y:auto}
.nxt{background:#F4F6FA;border-radius:18px;padding:12px 14px;margin-top:12px}
.nxt b{display:block;font-size:13px;margin-bottom:6px}
.nxt .nm2{display:flex;flex-wrap:wrap;gap:6px}
.nxt .nm2 span{background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.bsheet.enter{animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.grab{width:44px;height:5px;border-radius:999px;background:#D5DAE3;margin:0 auto 16px}
.fimh{display:flex;align-items:center;gap:12px}
.fimh h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.final{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.final b{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}
.final .a{color:var(--blue-d)}.final .b{color:var(--red)}
.final em{font-style:normal;color:var(--t2);font-weight:700;font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{border-radius:22px;padding:18px 14px;color:#fff;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s;min-height:84px;justify-content:center}
.opt:active{transform:scale(.97)}
.opt.A{background:var(--blue)}
.opt.B{background:var(--red)}
.opt.sug{box-shadow:0 0 0 4px #fff,0 0 0 8px #FBBF24}
.opt small{font-size:12px;font-weight:700;background:#FBBF24;color:#422006;border-radius:999px;padding:3px 10px}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setrow>div:first-child{min-width:0;flex:1}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.stpv{width:52px;height:44px;border:0;border-radius:12px;background:var(--field);text-align:center;font-size:18px;font-weight:800;outline:none;-moz-appearance:textfield;appearance:textfield}
.stpv::-webkit-outer-spin-button,.stpv::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stpv:focus{background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
"use strict";

/* =====================================================================
   FUT COM CRISTO — organizador de futebol da igreja
   Arquivo único, sem dependências externas: funciona offline.
   O cadastro de membros fica salvo no navegador (localStorage).
   ===================================================================== */

const KEY = "futcomcristo:v2";
/* Configurações ajustáveis na hora (salvas à parte, não mexem no cadastro):
   size = jogadores por time (com goleiro) | minutes = tempo de jogo | goals = gols para encerrar (0 = sem limite) */
const CFG_KEY = "futcomcristo:cfg";
const DEFAULT_CFG = { size: 7, minutes: 10, goals: 2 };
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(CFG_KEY)) || {};
    return {
      size: clamp(parseInt(c.size, 10) || DEFAULT_CFG.size, 2, 15),
      minutes: clamp(parseInt(c.minutes, 10) || DEFAULT_CFG.minutes, 1, 90),
      goals: isNaN(parseInt(c.goals, 10)) ? DEFAULT_CFG.goals : clamp(parseInt(c.goals, 10), 0, 30)
    };
  } catch (e) { return Object.assign({}, DEFAULT_CFG); }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(S.cfg)); } catch (e) { /* ignora */ } }
const CATS = [
  { n: "Pagante", c: "c0" },
  { n: "Não pagante", c: "c1" },
  { n: "Convidado", c: "c2" },
  { n: "Goleiro (isento)", c: "c3" }
];
const VERSES = [
  ["Como é bom e agradável quando os irmãos vivem em união!", "Salmos 133:1"],
  ["Ame o seu próximo como a si mesmo.", "Mateus 22:39"],
  ["Tudo o que fizerem, façam de todo o coração, como para o Senhor.", "Colossenses 3:23"],
  ["Melhor é serem dois do que um, porque têm melhor recompensa pelo seu trabalho.", "Eclesiastes 4:9"],
  ["Seja forte e corajoso! O Senhor, o seu Deus, estará com você por onde você andar.", "Josué 1:9"],
  ["Por isso todos saberão que vocês são meus discípulos: se amarem uns aos outros.", "João 13:35"],
  ["Suportem-se uns aos outros e perdoem-se mutuamente.", "Colossenses 3:13"],

}

function scheduleDismiss(n) {

/* ---------------------------------------------------------------------
   PRIORIDADE
   1) quem jogou menos partidas no dia
   2) categoria (Pagante > Não pagante > Convidado)
   3) quem esperou mais rodadas
   4) empate: sorteio aleatório
   --------------------------------------------------------------------- */
function rank(list) {
  return list.map(function (p) { return { p: p, r: Math.random() }; })
    .sort(function (a, b) { return (a.p.played || 0) - (b.p.played || 0) || a.p.cat - b.p.cat || b.p.waited - a.p.waited || a.r - b.r; })
    .map(function (x) { return x.p; });
}

function rankStable(list) {
  return list.map(function (p, i) { return { p: p, i: i }; })
    .sort(function (a, b) { return (a.p.played || 0) - (b.p.played || 0) || a.p.cat - b.p.cat || b.p.waited - a.p.waited || a.i - b.i; })
    .map(function (x) { return x.p; });
}
function orderQueue() {
  S.queue = rankStable(S.queue.map(function (id) { return P(id); }).filter(Boolean)).map(function (p) { return p.id; });
}

/* ===================================================================
   SORTEIO
   - 2 goleiros (marcados) por prioridade; se faltar, linha vai ao gol
   - vagas de linha por prioridade, distribuídas A,B,B,A,A,B,B,A...
   =================================================================== */
function drawTeams() {
  S.notices = [];
  const present = players().filter(function (p) { return p.present; });
  if (present.length < 4) {
    setNotices([{ type: "error", text: "São necessários pelo menos 4 jogadores presentes para sortear os times." }]);
    return false;
  }
  const warns = [];
  const ranked = rank(present);
  const want = S.cfg.size; // jogadores por time (com goleiro), definido na hora
  const size = present.length >= 2 * want ? want : Math.max(2, Math.floor(present.length / 2));
  if (present.length < 2 * want) {
    warns.push({ type: "warn", text: "Apenas " + present.length + " presentes para times de " + want + ": os times ficaram com " + size + " jogadores cada." });
  }
  const gkAll = ranked.filter(function (p) { return p.gk; });
  let gks = gkAll.slice(0, 2);
  const gkWait = gkAll.slice(2);
  const lineGk = [];
  if (gks.length < 2) {
    const extra = ranked.filter(function (p) { return gks.indexOf(p) < 0; }).slice(0, 2 - gks.length);
    extra.forEach(function (p) { lineGk.push(p.id); });
    gks = gks.concat(extra);
    warns.push({ type: "warn", text: 'Faltam goleiros: jogador(es) de linha foram para o gol (indicado como "linha no gol").' });
  }
  const rest = ranked.filter(function (p) { return gks.indexOf(p) < 0 && gkWait.indexOf(p) < 0; });
  const slots = 2 * (size - 1);
  const selected = rest.slice(0, slots);
  const waiting = rest.slice(slots);

  const A = { gk: gks[0].id, line: [] }, B = { gk: gks[1].id, line: [] };
  const pattern = ["A", "B", "B", "A"];
  selected.forEach(function (p, i) { (pattern[i % 4] === "A" ? A.line : B.line).push(p.id); });

  const why = {};
  gks.forEach(function (p) { why[p.id] = lineGk.indexOf(p.id) >= 0 ? "Goleiro: linha no gol (faltaram goleiros)" : "Goleiro fixo na partida"; });
  selected.forEach(function (p) { why[p.id] = "Selecionado: " + CATS[p.cat].n; });
  gkWait.forEach(function (p) { why[p.id] = "Goleiro na espera: entra quando o time dele sair"; });
  const cutoff = selected[selected.length - 1];
  waiting.forEach(function (p) {
    if (!cutoff) why[p.id] = "Aguardando: vagas preenchidas";
    else if ((p.played || 0) > (cutoff.played || 0)) why[p.id] = "Aguardando: já jogou mais partidas que quem entrou";
    else if (p.cat > cutoff.cat) why[p.id] = "Aguardando: vagas preenchidas por categoria de maior prioridade";
    else if (p.waited < cutoff.waited) why[p.id] = "Aguardando: mesma categoria, mas com menos rodadas de espera";
    else why[p.id] = "Aguardando: mesma prioridade, decidido no sorteio";
  });

  S.teams = { A: A, B: B, lineGk: lineGk };
  S.queue = waiting.map(function (p) { return p.id; });
  S.gkq = gkWait.map(function (p) { return p.id; });
  S.games = { A: 1, B: 1 };
  S.reasons = why;
  S.round = 1;
  resetMatch();
  setNotices(warns);
  return true;
}

function swapPlayer(k, id, isGk) {
  let pick, fromGk = false;
  if (isGk && S.gkq.length) { pick = S.gkq[0]; fromGk = true; }
  else if (S.queue.length) pick = S.queue[0];
  else { notice("warn", "A fila de espera está vazia."); return; }
  const t = S.teams[k];
  const nt = isGk ? Object.assign({}, t, { gk: pick }) : Object.assign({}, t, { line: t.line.map(function (x) { return x === id ? pick : x; }) });
  const lineGk = S.teams.lineGk.filter(function (x) { return x !== id; });
  const pp = P(pick), old = P(id);
  if (isGk && pp && !pp.gk) lineGk.push(pick);
  S.teams[k] = nt;
  S.teams.lineGk = lineGk;
  if (fromGk) S.gkq = S.gkq.slice(1); else S.queue = S.queue.slice(1);
  if (old && old.gk) S.gkq = S.gkq.concat([id]); else S.queue = S.queue.concat([id]);
  S.reasons[pick] = "Entrou: troca manual";
  S.reasons[id] = "Aguardando: trocado manualmente";
}

/* ===================================================================
   RODÍZIO DOS TIMES
   - Quem perde sai. Time com 3 partidas seguidas também sai (mesmo ganhando),
     desde que haja outro time completo esperando.
   - Empate com um time de 3 partidas: com 1 time esperando, sai só o de 3 partidas;
     com 2 ou mais esperando, saem os dois.
   - Goleiros ficam fixos. Só há troca quando existe goleiro esperando.
   =================================================================== */
function waitingTeams() {
  const size = S.teams && S.teams.A.line.length;
  return size ? Math.floor(S.queue.length / size) : 0;
}
function planRotation() {
  const a = S.scores.A, b = S.scores.B, W = waitingTeams();
  const gA = S.games.A, gB = S.games.B;
  const loser = a < b ? "A" : b < a ? "B" : null;
  const other = function (k) { return k === "A" ? "B" : "A"; };
  const must = ["A", "B"].filter(function (k) { return S.games[k] >= 3; });
  if (W >= 1 && must.length) {
    if (must.length === 2) {
      if (W >= 2) return { outs: ["A", "B"], text: "Os dois times jogaram 3 partidas seguidas e saem." };
      return { outs: null, text: "Os dois times jogaram 3 partidas, mas só há um time esperando: o grupo decide quem sai." };
    }
    const m = must[0], o = other(m);
    if (loser === null) {
      return W >= 2
        ? { outs: [m, o], text: "Empate. O Time " + m + " jogou 3 partidas seguidas e há " + W + " times esperando: os dois times saem." }
        : { outs: [m], text: "Empate. O Time " + m + " jogou 3 partidas seguidas e sai. O Time " + o + " permanece." };
    }
    if (loser === m) return { outs: [m], text: "O Time " + m + " perdeu e também completou 3 partidas. Sai o Time " + m + "." };
    return W >= 2
      ? { outs: [m, o], text: "O Time " + m + " venceu, mas jogou 3 partidas seguidas e sai. O Time " + o + " perdeu e também sai." }
      : { outs: [m], text: "O Time " + m + " venceu, mas jogou 3 partidas seguidas e sai. O Time " + o + " permanece (só há um time esperando)." };
  }
  if (loser) return { outs: [loser], text: "Sai quem perdeu." };
  if (gA !== gB) { const k = gA > gB ? "A" : "B"; return { outs: [k], text: "Empate: sai o time que está há mais partidas (Time " + k + ")." }; }
  return { outs: null, text: "Empate: o grupo decide qual time sai." };
}
function entryPlan(outs) {
  const court = [];
  ["A", "B"].forEach(function (k) { court.push(S.teams[k].gk); S.teams[k].line.forEach(function (x) { court.push(x); }); });
  const bump = function (id) { const p = P(id); return p ? Object.assign({}, p, { played: (p.played || 0) + (court.indexOf(id) >= 0 ? 1 : 0) }) : null; };
  const pool = rankStable(S.queue.map(function (id) { const p = bump(id); return p ? Object.assign(p, { waited: p.waited + 1 }) : null; }).filter(Boolean));
  const leaving = [];
  outs.forEach(function (k) { S.teams[k].line.forEach(function (id) { const p = bump(id); if (p) leaving.push(Object.assign(p, { waited: 0 })); }); });
  const leavingR = rankStable(leaving);
  let usedOut = false;
  const newLines = {};
  outs.forEach(function (k) {
    const need = S.teams[k].line.length, line = [];
    while (line.length < need) {
      let p = pool.shift();
      if (!p) { p = leavingR.shift(); if (p) usedOut = true; }
      if (!p) break;
      line.push(p.id);
    }
    newLines[k] = line;
  });
  return { pool: pool, leavingR: leavingR, newLines: newLines, usedOut: usedOut, court: court };
}
function previewEntry(outs) {
  const ep = entryPlan(outs), gkq = S.gkq.slice();
  return outs.map(function (k) {
    const t = S.teams[k]; let gk = t.gk, trocou = false;
    if (gkq.length) { gk = gkq.shift(); trocou = true; }
    const nm = function (id) { const p = P(id); return p ? p.name : "?"; };
    return { k: k, gk: nm(gk), trocou: trocou, line: ep.newLines[k].map(nm) };
  });
}
function rotate(outs) {
  const warns = [], why = {};
  const oldQueue = S.queue.slice();
  const ep = entryPlan(outs);
  const outIds = [];
  outs.forEach(function (k) { S.teams[k].line.forEach(function (id) { outIds.push(id); }); outIds.push(S.teams[k].gk); });
  const newLines = ep.newLines;
  if (ep.usedOut) warns.push({ type: "warn", text: "Fila insuficiente: o novo time foi completado com jogadores do time que saiu." });
  const newQueue = ep.pool.map(function (p) { return p.id; }).concat(ep.leavingR.map(function (p) { return p.id; }));
  const gkq = S.gkq.slice();
  let lineGk = S.teams.lineGk.slice();
  outs.forEach(function (k) {
    const t = S.teams[k];
    let gk = t.gk;
    if (gkq.length) {
      const old = P(t.gk);
      gk = gkq.shift();
      if (old && old.gk) gkq.push(old.id); else if (old) newQueue.push(old.id);
      lineGk = lineGk.filter(function (x) { return x !== t.gk; });
      why[gk] = "Entrou: troca de goleiro";
      why[t.gk] = old && old.gk ? "Goleiro na espera: entra quando o time dele sair" : "Aguardando: fim da fila";
    }
    S.teams[k] = { gk: gk, line: newLines[k] };
  });
  const entering = [];
  outs.forEach(function (k) { entering.push(S.teams[k].gk); newLines[k].forEach(function (id) { entering.push(id); }); });
  S.roster = S.roster.map(function (p) {
    const base = ep.court.indexOf(p.id) >= 0 ? Object.assign({}, p, { played: (p.played || 0) + 1 }) : p;
    if (entering.indexOf(p.id) >= 0 || outIds.indexOf(p.id) >= 0) return Object.assign({}, base, { waited: 0 });
    if (oldQueue.indexOf(p.id) >= 0) return Object.assign({}, base, { waited: p.waited + 1 });
    return base;
  });
  outs.forEach(function (k) { newLines[k].forEach(function (id) { why[id] = "Entrou: quem jogou menos tem prioridade"; }); });
  newQueue.forEach(function (id) { why[id] = outIds.indexOf(id) >= 0 ? "Aguardando: time que saiu, vai para o fim" : "Aguardando: ordem de prioridade da fila"; });
  ["A", "B"].filter(function (k) { return outs.indexOf(k) < 0; }).forEach(function (k) {
    S.teams[k].line.concat([S.teams[k].gk]).forEach(function (id) { why[id] = "Permanece em quadra"; });
    S.games[k] += 1;
  });
  outs.forEach(function (k) { S.games[k] = 1; });
  S.teams.lineGk = lineGk;
  S.queue = newQueue;
  S.gkq = gkq;
  orderQueue();
  Object.keys(why).forEach(function (k) { S.reasons[k] = why[k]; });
  S.round += 1;
  resetMatch();
  setNotices(warns);
}

/* ===================================================================
   CHEGADAS TARDIAS E SAÍDAS (mantém fila e quadra em dia com a presença)
   - Quem chega depois entra na fila, respeitando a prioridade
   - Quem sai da lista de presentes deixa a fila; se estava em quadra, é substituído
   =================================================================== */
function reconcile() {
  if (!S.teams) return;
  const byId = {};
  players().forEach(function (p) { byId[p.id] = p; });
  const ok = function (id) { return !!(byId[id] && byId[id].present); };
  const court = [];
  ["A", "B"].forEach(function (k) { court.push(S.teams[k].gk); S.teams[k].line.forEach(function (x) { court.push(x); }); });
  S.queue = S.queue.filter(ok);
  S.gkq = S.gkq.filter(ok);
  const known = {};
  court.concat(S.queue, S.gkq).forEach(function (id) { known[id] = 1; });
  const arrived = [];
  players().forEach(function (p) {
    if (!p.present || known[p.id]) return;
    arrived.push(p.name);
    S.roster = S.roster.map(function (x) { return x.id === p.id ? Object.assign({}, x, { waited: 0 }) : x; });
    if (p.gk) S.gkq.push(p.id); else S.queue.push(p.id);
    S.reasons[p.id] = "Chegou depois: entrou na fila pela prioridade";
  });
  orderQueue();
  const subs = [];
  ["A", "B"].forEach(function (k) {
    const t = S.teams[k];
    if (!ok(t.gk)) {
      let nu = S.gkq.shift();
      if (!nu && S.queue.length) { nu = S.queue.shift(); S.teams.lineGk.push(nu); }
      if (nu) { subs.push(byId[t.gk] ? byId[t.gk].name : "goleiro"); t.gk = nu; S.reasons[nu] = "Entrou: substituiu quem saiu"; }
    }
    t.line = t.line.map(function (id) {
      if (ok(id) || !S.queue.length) return id;
      const nu = S.queue.shift();
      subs.push(byId[id] ? byId[id].name : "jogador"); S.reasons[nu] = "Entrou: substituiu quem saiu";
      return nu;
    });
  });
  if (arrived.length) notice("info", (arrived.length === 1 ? arrived[0] + " chegou" : arrived.slice(0, 3).join(", ") + (arrived.length > 3 ? " e mais " + (arrived.length - 3) : "") + " chegaram") + " e entrou na fila de espera.");
  if (subs.length) notice("warn", "Saiu da quadra: " + subs.join(", ") + ". Substituído pelo primeiro da fila.");
}

/* ---------- Partida ---------- */
function resetMatch() {
  S.running = false; S.started = false; S.total = S.cfg.minutes * 60000; S.timeLeft = S.total;
  S.scores = { A: 0, B: 0 }; S.finished = null; S.confirmReset = false;
}
function prepAudio() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx && !audioCtx) audioCtx = new Ctx();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* som é opcional */ }
}
function beep() {
  try {
    prepAudio();
    if (!audioCtx) return;
    [0, 0.35, 0.7].forEach(function (d) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.28);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.3);
    });
  } catch (e) { /* ignora */ }
}
function finish(reason) {
  S.running = false;
  if (!S.finished) {
    S.finished = { reason: reason };
    S.sheetFresh = true;
    S.tab = "times"; S.tabFresh = true;
    beep();
    try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) { /* ignora */ }
  }
  render();
}
function startTimer() {
  prepAudio();
  S.endsAt = Date.now() + S.timeLeft; // baseado em Date.now()
  S.started = true; S.running = true;
}
function pauseTimer() {
  S.timeLeft = Math.max(0, S.endsAt - Date.now());
  S.running = false;
}
const R = 104, CIRC = 2 * Math.PI * R;
function paintClock() {
  const c = document.getElementById("clock");
  if (c) { c.textContent = fmt(S.timeLeft); c.className = "clock" + (S.timeLeft < 60000 ? " low" : ""); }
  const r = document.getElementById("ring");
  if (r) {
    r.setAttribute("stroke-dashoffset", String(CIRC * (1 - clamp((S.total - S.timeLeft) / S.total, 0, 1))));
    r.setAttribute("class", "rprog" + (S.timeLeft < 60000 ? " low" : ""));
  }
}
function tick() {
  if (!S.running) return;
  S.timeLeft = Math.max(0, S.endsAt - Date.now());
  paintClock();
  if (S.timeLeft <= 0) finish("O tempo acabou (" + fmt(S.total) + ").");
}
function goal(k, delta) {
  if (S.finished) return;
  S.scores[k] = Math.max(0, S.scores[k] + delta);
  const g = S.cfg.goals;
  if (g > 0 && S.scores[k] >= g) { finish("O Time " + k + " fez " + g + (g === 1 ? " gol." : " gols.")); return; }
  render();
}

/* ---------- Ajustes manuais (tamanho do time, tempo, gols e placar) ---------- */
function setMinutes(m) {
  m = clamp(m, 1, 90);
  const old = S.total;
  S.cfg.minutes = m; S.total = m * 60000; saveCfg();
  if (S.finished) return;
  if (!S.started) { S.timeLeft = S.total; return; }
  const delta = S.total - old; // partida em andamento: o tempo restante muda junto
  if (S.running) { S.endsAt += delta; S.timeLeft = Math.max(0, S.endsAt - Date.now()); }
  else S.timeLeft = Math.max(0, S.timeLeft + delta);
  if (S.timeLeft <= 0) finish("O tempo acabou (" + fmt(S.total) + ").");
}
function setGoals(g) {
  g = clamp(g, 0, 30);
  S.cfg.goals = g; saveCfg();
  if (S.teams && !S.finished && g > 0 && (S.scores.A >= g || S.scores.B >= g)) {
    finish("O Time " + (S.scores.A >= g ? "A" : "B") + " fez " + g + (g === 1 ? " gol." : " gols."));
  }
}
function cfgValue(k) {
  return k === "size" ? S.cfg.size : k === "minutes" ? S.cfg.minutes : k === "goals" ? S.cfg.goals : k === "scoreA" ? S.scores.A : S.scores.B;
}
function setCfg(k, v) {
  if (isNaN(v)) return;
  if (k === "size") { S.cfg.size = clamp(v, 2, 15); saveCfg(); }
  else if (k === "minutes") setMinutes(v);
  else if (k === "goals") setGoals(v);
  else if (k === "scoreA") S.scores.A = clamp(v, 0, 99); // correção manual: não encerra sozinho
  else if (k === "scoreB") S.scores.B = clamp(v, 0, 99);
}
function stepper(k, min, max, label) {
  return '<div class="stp"><button class="icb" data-act="cfgStep" data-k="' + k + '" data-d="-1" aria-label="Diminuir ' + label + '">' + ic("minus") + "</button>" +
    '<input class="stpv" id="cfg-' + k + '" type="number" inputmode="numeric" min="' + min + '" max="' + max + '" value="' + cfgValue(k) + '" data-cfg="' + k + '" aria-label="' + label + '">' +
    '<button class="icb" data-act="cfgStep" data-k="' + k + '" data-d="1" aria-label="Aumentar ' + label + '">' + ic("plus") + "</button></div>";
}
function sorteioCard(withRedraw) {
  const n = S.roster.filter(function (p) { return p.present; }).length, w = S.cfg.size;
  let hint;
  if (n < 4) hint = "Marque pelo menos 4 presentes para sortear.";
  else if (n >= 2 * w) hint = (2 * w) + " jogam (" + w + " por time)" + (n - 2 * w ? " e " + (n - 2 * w) + " ficam na fila." : ".");
  else hint = "Com " + n + " presentes, os times ficam com " + Math.max(2, Math.floor(n / 2)) + " jogadores cada.";
  return '<section class="card stack"><div class="split"><div><h2 class="ttl">Sorteio</h2><p class="muted" style="margin-top:2px">Ajuste conforme o campo do dia.</p></div>' + tile("shuffle", "blue") + "</div>" +

    '<p class="muted">' + esc(hint) + (withRedraw ? " O novo valor vale ao refazer o sorteio." : "") + "</p>" +
    (withRedraw ? '<button class="btn sec full" data-act="redraw">' + ic("shuffle") + " Refazer sorteio</button>" : "") + "</section>";
}
function settingsBlock() {

      '<div class="setrow"><div><div class="nm">Placar do Time A</div></div>' + stepper("scoreA", 0, 99, "placar do Time A") + "</div>" +
      '<div class="setrow"><div><div class="nm">Placar do Time B</div></div>' + stepper("scoreB", 0, 99, "placar do Time B") + "</div></div>";

/* ---------------------------------------------------------------------
   SINCRONIZAÇÃO ONLINE (Firebase Firestore, via REST, sem bibliotecas)
   - Só os MEMBROS (nome, goleiro, mês pago) vão para a nuvem.
   - Funciona offline: as mudanças ficam no celular e sobem quando houver internet.
   - Em conflito, vale a alteração mais recente (campo "u").
   --------------------------------------------------------------------- */
const FB = { project: "futcomcristo-eb71f", key: "AIzaSyALP-1NvqM-a2Rofd9HP6CvbZOyN7JjQHU" };
const SY_KEY = "futcomcristo:sync";
const SY = (function () {
  try { const r = JSON.parse(localStorage.getItem(SY_KEY)); if (r && r.tomb) return { tomb: r.tomb }; } catch (e) { /* ignora */ }
  return { tomb: {} };
})();
function saveSy() { try { localStorage.setItem(SY_KEY, JSON.stringify(SY)); } catch (e) { /* ignora */ } }
S.sync = { state: "idle", last: 0, msg: "" };
let syTimer = null, syBusy = false, syPromise = null;
function syLabel() {
  const y = S.sync;
  if (y.state === "busy") return "Sincronizando…";
  if (y.state === "err") return "Sem conexão com a nuvem. Os dados estão salvos neste celular." + (y.msg ? " (" + y.msg + ")" : "");
  if (y.state === "ok") {
    const t = new Date(y.last);
    return "Sincronizado às " + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  }
  return "Aguardando sincronização";
}
function fsUrl(path, extra) {
  return "https://firestore.googleapis.com/v1/projects/" + FB.project + "/databases/(default)/documents/" + path + "?key=" + FB.key + (extra || "");
}
function fsParse(doc) {
  const f = doc.fields || {}, id = doc.name.split("/").pop();
  return {
    id: id, name: f.name ? f.name.stringValue || "" : "", gk: !!(f.gk && f.gk.booleanValue),
    paidMonth: f.paidMonth ? f.paidMonth.stringValue || "" : "", d: !!(f.d && f.d.booleanValue),
    u: f.u ? parseInt(f.u.integerValue || "0", 10) || 0 : 0
  };
}
function fsBody(p) {
  return JSON.stringify({ fields: {
    name: { stringValue: p.name || "" }, gk: { booleanValue: !!p.gk }, paidMonth: { stringValue: p.paidMonth || "" },
    u: { integerValue: String(p.u || 0) }, d: { booleanValue: !!p.d }
  } });
}
function fsPut(p) {
  return fetch(fsUrl("members/" + encodeURIComponent(p.id)), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: fsBody(p) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
}
function fsList() {
  const out = [];
  function page(tok) {
    return fetch(fsUrl("members", "&pageSize=300" + (tok ? "&pageToken=" + encodeURIComponent(tok) : ""))).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      (j.documents || []).forEach(function (d) { out.push(fsParse(d)); });
      return j.nextPageToken ? page(j.nextPageToken) : out;
    });
  }
  return page("");
}
function syncNow(manual) {
  if (typeof fetch !== "function") return Promise.resolve();
  if (syBusy) return syPromise.then(function () { return syncNow(manual); });
  syBusy = true; if (manual) { S.sync.state = "busy"; render(); }
  let changed = false;
  syPromise = fsList().then(function (remote) {
    const rm = {}; remote.forEach(function (r) { rm[r.id] = r; });
    // convidados/duplicados: membro local nunca sincronizado com o mesmo nome de um remoto => adota o remoto
    const norm = function (n) { return String(n).trim().toLowerCase(); };
    const remNames = {}; remote.forEach(function (r) { if (!r.d) remNames[norm(r.name)] = r.id; });
    const toPush = [];
    let roster = S.roster.slice();
    // 1) aplica remoto
    remote.forEach(function (r) {
      const i = roster.findIndex(function (p) { return p.id === r.id; });
      if (r.d) {
        if (i >= 0 && roster[i].kind === "member" && (roster[i].u || 0) <= r.u) { roster.splice(i, 1); changed = true; }
        if (SY.tomb[r.id] != null && SY.tomb[r.id] <= r.u) { delete SY.tomb[r.id]; }
        return;
      }
      if (SY.tomb[r.id] != null) {
        if (SY.tomb[r.id] >= r.u) { toPush.push({ id: r.id, name: r.name, gk: r.gk, paidMonth: r.paidMonth, u: SY.tomb[r.id], d: true }); return; }
        delete SY.tomb[r.id];
      }
      if (i < 0) {
        roster.push({ id: r.id, name: r.name, gk: r.gk, present: false, waited: 0, kind: "member", paidMonth: r.paidMonth, u: r.u, s: 1 });
        changed = true;
      } else if (r.u > (roster[i].u || 0)) {
        roster[i] = Object.assign({}, roster[i], { name: r.name, gk: r.gk, paidMonth: r.paidMonth, u: r.u, s: 1 });
        changed = true;
      }
    });
    // 2) duplicados antigos (membros locais sem "s" cujo nome já existe na nuvem)
    roster = roster.filter(function (p) {
      if (p.kind !== "member" || p.s || rm[p.id]) return true;
      if (remNames[norm(p.name)]) { changed = true; return false; }
      return true;
    });
    // 3) envia o que é local e mais novo
    roster.forEach(function (p) {
      if (p.kind !== "member") return;
      const r = rm[p.id];
      if (!r || (p.u || 0) > r.u) {
        toPush.push({ id: p.id, name: p.name, gk: p.gk, paidMonth: p.paidMonth, u: p.u || Date.now(), d: false });
      }
    });
    Object.keys(SY.tomb).forEach(function (id) {
      if (!rm[id] || (!rm[id].d && SY.tomb[id] >= rm[id].u) || (rm[id].d && SY.tomb[id] > rm[id].u))
        toPush.push({ id: id, name: "", gk: false, paidMonth: "", u: SY.tomb[id], d: true });
    });
    S.roster = roster;
    const sent = {};
    return Promise.all(toPush.filter(function (p) { if (sent[p.id]) return false; sent[p.id] = 1; return true; }).map(fsPut)).then(function () {
      S.roster = S.roster.map(function (p) {
        if (p.kind === "member" && !p.s && (sent[p.id] || rm[p.id])) return Object.assign({}, p, { s: 1, u: p.u || Date.now() });
        return p;
      });
      Object.keys(SY.tomb).forEach(function (id) { if (sent[id]) delete SY.tomb[id]; });
      saveSy();
    });
  }).then(function () {
    S.sync.state = "ok"; S.sync.last = Date.now(); S.sync.msg = "";
  }).catch(function (e) {
    S.sync.state = "err"; S.sync.msg = e && e.message ? String(e.message).slice(0, 40) : "";
  }).then(function () {
    syBusy = false; render();
  });
  return syPromise;
}
function syncSoon() {
  if (typeof fetch !== "function") return;
  clearTimeout(syTimer);
  syTimer = setTimeout(function () { syncNow(false); }, 1200);
}
function syncStart() {
  if (typeof fetch !== "function") return;
  syncNow(false);
  setInterval(function () { if (!document.hidden) syncNow(false); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) syncNow(false); });
  if (typeof window.addEventListener === "function") window.addEventListener("online", function () { syncNow(false); });
}

});
document.addEventListener("input", function (e) {
  const el = e.target, key = el.getAttribute && el.getAttribute("data-bind");
  if (!key) return;
  const val = el.type === "checkbox" ? el.checked : el.value;
  if (key === "search") { S.search = val; render(); }
  else S.f[key] = val;
});
document.addEventListener("change", function (e) {
  const k = e.target.getAttribute && e.target.getAttribute("data-cfg");
  if (!k) return;
  setCfg(k, parseInt(e.target.value, 10));
  render();
});
document.addEventListener("keydown", function (e) {
  const el = e.target;
  if (e.key === "Enter" && el.getAttribute && el.getAttribute("data-enter")) act(el.getAttribute("data-enter"));
});
document.addEventListener("visibilitychange", tick);
setInterval(tick, 200);

window.__fut = { S: S, act: act, render: render, syncNow: syncNow };
render();
syncStart();

/* Registra o service worker (app instalável e offline). Só funciona em http/https. */
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () { /* ignora */ });
  });
}
})();
</script>
</body>
</html>
